<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmEditor-OpenCC-Macro Web Engine</title>
    <style>
        /* 溫潤清爽色系與現代化 UI 設定 */
        :root {
            --bg-color: #F9F7F3;          
            --panel-bg: #FFFFFF;
            --text-color: #4A4A4A;
            --btn-local: #EADCE0;         
            --btn-s2t: #DDF0ED;           
            --btn-t2s: #FCECE6;           
            --btn-s2twp: #E6F3FF;         
            --btn-tw2sp: #E2F5EE;         
            --btn-s2te: #FFF6E0;          
            --border-radius: 12px;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        .header { background: var(--panel-bg); padding: 15px 20px; border-radius: var(--border-radius); box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 15px; position: relative; }
        
        /* 新增：主標題樣式 */
        .main-title { margin: 0 0 15px 0; font-size: 22px; color: #2D5A54; letter-spacing: 0.5px; border-bottom: 1px solid #F0F0F0; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 12px; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        
        button { padding: 9px 18px; font-size: 14px; font-weight: bold; cursor: pointer; border: 1px solid transparent; border-radius: 8px; transition: all 0.2s ease; letter-spacing: 0.5px; }
        button:hover { filter: brightness(0.96); box-shadow: 0 3px 6px rgba(0,0,0,0.08); transform: translateY(-1px); border-color: rgba(0,0,0,0.05); }
        button:active { transform: translateY(1px); box-shadow: none; }
        
        .btn-local { background: var(--btn-local); color: #6A4B55; }
        .btn-s2t { background: var(--btn-s2t); color: #2D5A54; }
        .btn-t2s { background: var(--btn-t2s); color: #8A4A33; }
        .btn-s2twp { background: var(--btn-s2twp); color: #325A82; }
        .btn-tw2sp { background: var(--btn-tw2sp); color: #326B57; }
        .btn-s2te { background: var(--btn-s2te); color: #7A601A; }
        .divider { width: 1px; height: 25px; background: #E0E0E0; margin: 0 5px; }

        .options-bar { display: flex; gap: 20px; background: #F8F9FA; padding: 10px 15px; border-radius: 8px; font-size: 14px; border: 1px solid #E9ECEF; flex-wrap: wrap;}
        .options-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: #555; font-weight: 500; }
        .options-bar input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #83C5BE; }

        .btn-info { position: absolute; top: 15px; right: 20px; background: transparent; color: #888; border: none; font-size: 20px; padding: 0; cursor: pointer; transition: color 0.2s; box-shadow: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .btn-info:hover { color: #0275d8; transform: scale(1.1); box-shadow: none; background: #F0F4F8; }

        .main-area { display: flex; gap: 20px; flex: 1; min-height: 0; }
        .io-box { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--panel-bg); border-radius: var(--border-radius); box-shadow: 0 2px 8px rgba(0,0,0,0.02); overflow: hidden; border: 2px solid #EBEBEB; transition: border-color 0.2s; }
        .io-box:focus-within { border-color: #A2D2FF; }
        
        .io-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #F8F9FA; border-bottom: 1px solid #EBEBEB; }
        .io-title { font-size: 14px; font-weight: bold; color: #666; display: flex; align-items: center; gap: 5px; }
        
        /* 複製按鈕基礎樣式 */
        .btn-copy { background: transparent; color: #666; border: 1px solid #D1D1D1; padding: 4px 10px; font-size: 12px; font-weight: bold; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
        .btn-copy:hover { background: #E9ECEF; color: #333; }
        .btn-copy.copied { background: #D4EDDA; color: #155724; border-color: #C3E6CB; }

        textarea { flex: 1; padding: 15px; font-size: 16px; font-family: 'Consolas', 'Microsoft JhengHei', monospace; border: none; resize: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.01); line-height: 1.6; }
        textarea:focus { outline: none; }
        #outputText { background-color: #FAFAFA; }

        #outputFrame { display: none; width: 100%; height: 100%; border: none; background: white; }

        .status-bar { margin-top: 15px; padding: 12px 20px; background: #3B4252; color: #A3BE8C; font-weight: bold; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); letter-spacing: 0.5px; transition: opacity 0.3s ease; }
        .status-bar.error { color: #BF616A; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: white; width: 550px; max-width: 90%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; transform: translateY(-20px); transition: transform 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { background: #F8F9FA; padding: 15px 20px; border-bottom: 1px solid #EBEBEB; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: #333; font-size: 18px; }
        .modal-close { background: transparent; border: none; font-size: 20px; color: #999; cursor: pointer; padding: 0; box-shadow: none; }
        .modal-close:hover { color: #333; transform: none; background: transparent; }
        .modal-body { padding: 20px; font-size: 14px; line-height: 1.6; color: #555; }
        .modal-body p { margin-top: 0; }
        .modal-body ul, .modal-body ol { padding-left: 20px; margin-bottom: 0; }
        .modal-body li { margin-bottom: 8px; }
        .modal-body a { color: #0275d8; text-decoration: none; }
        .modal-body a:hover { text-decoration: underline; }
        .modal-body .code-block { background: #F1F3F5; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-top: 15px; border-left: 4px solid #83C5BE;}
        .tagline { font-weight: bold; color: #2D5A54; font-size: 15px; text-align: center; margin-top: 30px; margin-bottom: 5px;}
        .dev-by { text-align: center; font-style: italic; font-size: 13px; color: #888; margin-top: 0; margin-bottom: 0;}

        @media screen and (max-width: 600px) {
            .main-area { flex-direction: column; }
            .main-title { font-size: 18px; }
            .copy-text { display: none; } /* 隱藏複製文字 */

        }
    </style>
</head>

    <h1 class="main-title" data-i18n="mainTitle">EmEditor OpenCC Macro 繁簡轉換</h1>
    
    <div class="toolbar">
        <div class="controls">
            <input type="file" id="macroLoader" accept=".jsee" style="display:none">

    </div>

            </button>
        </div>

    </div>
    
    <div class="io-box">
        <div class="io-header">
            <span class="io-title" data-i18n="titleOutput">✨ 轉換結果</span>

        </div>
        <textarea id="outputText" data-i18n-placeholder="placeholderOutput" placeholder="轉換結果將顯示於此..." readonly></textarea>

<div class="status-bar" id="statusBar" data-i18n="statusReady">ℹ️ 就緒。請輸入或貼上文字並選擇轉換模式。</div>

let currentLang = 'en'; 
const sysLang = navigator.language || navigator.userLanguage;
if (sysLang.startsWith('zh')) {
    currentLang = (sysLang.includes('TW') || sysLang.includes('HK') || sysLang.includes('MO') || sysLang === 'zh-Hant') ? 'zh-TW' : 'zh-CN';
}
document.documentElement.lang = currentLang;

let fakeLangID = 1033; 
if (currentLang === 'zh-TW') fakeLangID = 1028;
if (currentLang === 'zh-CN') fakeLangID = 2052;

function T(key) { return i18nDict[currentLang][key] || key; }

// ==========================================
// 1. 環境智慧偵測與 UI 語言套用
// ==========================================
document.addEventListener("DOMContentLoaded", () => {
    if (window.location.protocol !== "file:") {
        document.getElementById('btnLocalLoad').style.display = 'none';
        document.getElementById('localDivider').style.display = 'none';
    }

    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = T(el.getAttribute('data-i18n-placeholder')); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = T(el.getAttribute('data-i18n-title')); });
    document.getElementById('modalBody').innerHTML = T('modalHTML');
});

function toggleModal(show) {
    const modal = document.getElementById('infoModal');
    if (show) {
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    } else {
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 300);
    }
}

// ==========================================
// 2. 一鍵複製功能 (升級版：支援響應式結構)
// ==========================================
async function copyText(elementId, btnElement) {
    const text = document.getElementById(elementId).value;
    if (!text) {
        updateStatus(T('msgNoText'), true);
        setTimeout(() => updateStatus(T('statusReady')), 2000);
        return;
    }
    try {
        await navigator.clipboard.writeText(text);
        
        // 分別取得圖示與文字的 Span，只改變內容而不破壞結構
        const iconSpan = btnElement.querySelector('.copy-icon');
        const textSpan = btnElement.querySelector('.copy-text');
        
        const originalIcon = iconSpan.innerText;
        const originalText = textSpan.innerText;
        
        iconSpan.innerText = "✅";
        textSpan.innerText = T('msgCopied');
        btnElement.classList.add("copied");
        
        setTimeout(() => {
            iconSpan.innerText = originalIcon;
            textSpan.innerText = originalText;
            btnElement.classList.remove("copied");
        }, 2000);
    } catch (err) { alert(T('msgCopyFail')); }
}

// ==========================================
// 3. UI 狀態與防呆清理
// ==========================================
function updateStatus(msg, isError = false) {
    const bar = document.getElementById('statusBar');
    bar.innerText = msg;
    bar.className = isError ? "status-bar error" : "status-bar";
}

// ==========================================
// 4. EmEditor 虛擬環境建構 (Mocking)
// ==========================================
class MacroQuitException extends Error { constructor() { super("MACRO_QUIT"); } }

const eePosLogical = 1, eePosCell = 4, eeShowTipHide = 0;
let Redraw = true, CombineHistory = false;

Object.defineProperty(window, 'status', {
    get: function() { return this._macroStatus || ""; },
    set: function(val) { this._macroStatus = val; updateStatus(val); },
    configurable: true
});

const shell = {
    GetKeyState: (code) => {
        if (code === 0x10) return document.getElementById('chkPure').checked ? -1 : 0;
        if (code === 0x11) return document.getElementById('chkSimulate').checked ? -1 : 0;
        if (code === 0x12) return document.getElementById('chkIgnoreTW').checked ? -1 : 0;
        return 0;
    },
    KeepRunning: false, SendKeys: () => {}
};

const editor = { LangID: fakeLangID, ExecuteCommandByID: () => {} };

function resetOutputView() {
    document.getElementById('outputText').style.display = 'block';
    document.getElementById('outputFrame').style.display = 'none';
    document.getElementById('outputText').value = "";
    document.getElementById('btnCopyRight').style.display = 'flex'; // 恢復顯示複製按鈕 (flex 確保圖示對齊)
}

const mockDocument = {
    selection: {
        get Text() { return document.getElementById('inputText').value; },
        set Text(val) {
            resetOutputView();
            document.getElementById('outputText').value = val;
        },
        get TextLength() { return this.Text.length; },
        get IsEmpty() { return this.Text.length === 0; },
        SelectWord: () => {}, Mode: 1, Count: 1,
        GetTopPointY: () => 1, GetTopPointX: () => 1, GetBottomPointY: () => 1, GetBottomPointX: () => 1,
        SetActivePoint: () => {}, SetAnchorPoint: () => {}
    },
    filters: { Count: 0 }, Csv: null, GetLine: () => "", GetCell: () => "", SetCell: () => {}
};

const WebBar = { Visible: true, SetFocus: () => {}, Open: (url) => {} };
const OutputBar = { Clear: () => {}, writeln: console.log, Visible: false };

const web = {
    window: window,
    document: {
        open: () => {},
        write: (html) => {
            document.getElementById('outputText').style.display = 'none';
            document.getElementById('btnCopyRight').style.display = 'none';
            const frame = document.getElementById('outputFrame');
            frame.style.display = 'block';
            frame.contentWindow.document.open();
            frame.contentWindow.document.write(html);
            frame.contentWindow.document.close();
        },
        close: () => {}
    }
};

// ==========================================
// 5. 核心載入與執行引擎
// ==========================================
function executeMacroCode(code, filename) {
    resetOutputView();
    code = code.replace(/^#.*/gm, function(match) { return '// ' + match; });

    const msgRun = currentLang === 'en' ? `⏳ Parsing engine starting, executing ${filename || 'macro'}...` : 
                  (currentLang === 'zh-CN' ? `⏳ 解析引擎启动中，执行 ${filename || '宏'}...` : `⏳ 解析引擎啟動中，執行 ${filename || '巨集'}...`);
    updateStatus(msgRun);

    const macroRunner = new Function(
        'document', 'shell', 'editor', 'WebBar', 'OutputBar', 'web',
        'eePosLogical', 'eePosCell', 'eeShowTipHide', 'Redraw', 'CombineHistory',
        'ShowTip', 'Quit', 'alert', code
    );

    const fakeShowTip = (msg) => { if (msg) updateStatus(msg); };
    const fakeQuit = () => { throw new MacroQuitException(); };
    const fakeAlert = (msg) => { alert("Message:\n" + msg); };

    try {
        macroRunner(
            mockDocument, shell, editor, WebBar, OutputBar, web,
            eePosLogical, eePosCell, eeShowTipHide, Redraw, CombineHistory,
            fakeShowTip, fakeQuit, fakeAlert
        );
    } catch (error) {
        if (!(error instanceof MacroQuitException)) {
            console.error(error);
            const errPrefix = currentLang === 'en' ? "❌ Execution error: " : (currentLang === 'zh-CN' ? "❌ 执行发生错误: " : "❌ 執行發生錯誤: ");
            updateStatus(errPrefix + error.message, true);
        }
    }
}

document.getElementById('macroLoader').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (!file) return;
    let reader = new FileReader();
    reader.onload = function(event) {
        executeMacroCode(event.target.result, file.name);
        e.target.value = ''; 
    };
    reader.readAsText(file);
});

async function loadAndRun(filename) {
    const msgRead = currentLang === 'en' ? `⏳ Loading script ${filename} ...` : (currentLang === 'zh-CN' ? `⏳ 读取脚本 ${filename} ...` : `⏳ 讀取腳本 ${filename} ...`);
    updateStatus(msgRead);
    try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let code = await response.text();
        executeMacroCode(code, filename);
    } catch (error) {
        updateStatus(T('errLoadLocal'), true);
    }
}
</script>
